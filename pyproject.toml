[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "almasi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ['yaspin', 'watchfiles>=1,<2']

[tool.setuptools]
py-modules = ["almasi"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*", "root*", "plugins*"]
