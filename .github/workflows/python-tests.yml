name: Core Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: master
          path: loader
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install loader and Core dependencies
        run: |
          python -m pip install ./loader
          python -m pip install -r ./core/requirements.txt
      - name: Expose Core checkout without updating it
        run: |
          mkdir -p "$RUNNER_TEMP/almasi.a"
          cp -a core/a.py core/lib core/root core/plugins core/requirements.txt "$RUNNER_TEMP/almasi.a/"
      - name: Run Core tests
        env:
          ALMASI_PATH: ${{ runner.temp }}
        run: cd "$RUNNER_TEMP" && python -c 'from almasi import a; a.tester.run()'

      - name: Verify concurrent File publication during on-load setup
        env:
          ALMASI_PATH: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import threading
          from concurrent.futures import ThreadPoolExecutor
          from almasi import a

          entered = threading.Event()
          release = threading.Event()
          ready = threading.Event()

          class Source(a.Module):
              @classmethod
              def __on_load__(cls, file):
                  entered.set()
                  assert release.wait(5)
                  ready.set()

          file = a.File(a, __file__, 'almasi.concurrent_probe', lambda: Source)

          with ThreadPoolExecutor(max_workers=2) as executor:
              first = executor.submit(file.load)
              try:
                  assert entered.wait(5)
                  second = executor.submit(file.load)
                  try:
                      result = second.result(timeout=0.5)
                  except TimeoutError:
                      result = None
                  assert result is None or ready.is_set(), 'Concurrent reader observed a class before on-load completed'
              finally:
                  release.set()
              assert first.result(timeout=5) is Source
              assert second.result(timeout=5) is Source
          PY
