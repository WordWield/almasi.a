name: Core Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: master
          path: loader
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install loader and Core dependencies
        run: |
          python -m pip install ./loader
          python -m pip install -r ./core/requirements.txt
      - name: Expose Core checkout without updating it
        run: |
          mkdir -p "$RUNNER_TEMP/almasi.a"
          cp -a core/a.py core/lib core/root core/plugins core/requirements.txt "$RUNNER_TEMP/almasi.a/"
      - name: Run Core tests
        env:
          ALMASI_PATH: ${{ runner.temp }}
        run: cd "$RUNNER_TEMP" && python -c 'from almasi import a; a.tester.run()'
