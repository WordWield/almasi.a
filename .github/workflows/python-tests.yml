name: Core Python tests

on:
  push:
    branches: [master, generic-resource]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: WordWield/almasi
          ref: 42f45c8912ea48e07797378a94b159ad78a4bb11
          path: loader
          persist-credentials: false
      - name: Run native Core tests in an isolated local environment
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python_bin="$(command -v "python$PYTHON_VERSION" || true)"
          if [ -z "$python_bin" ]; then
            for candidate in \
              /opt/homebrew/opt/"python@$PYTHON_VERSION"/bin/"python$PYTHON_VERSION" \
              /usr/local/opt/"python@$PYTHON_VERSION"/bin/"python$PYTHON_VERSION" \
              /Library/Frameworks/Python.framework/Versions/"$PYTHON_VERSION"/bin/"python$PYTHON_VERSION" \
              "${PYENV_ROOT:-$HOME/.pyenv}"/versions/"$PYTHON_VERSION".*/bin/python; do
              if [ -x "$candidate" ]; then
                python_bin="$candidate"
                break
              fi
            done
          fi
          if [ -z "$python_bin" ]; then
            echo "Python $PYTHON_VERSION must already be installed on the self-hosted runner."
            exit 1
          fi

          "$python_bin" -c 'import os, sys; assert ".".join(map(str, sys.version_info[:2])) == os.environ["PYTHON_VERSION"]; print(sys.version)'
          work="$(mktemp -d "$RUNNER_TEMP/almasi-core.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          "$python_bin" -m venv "$work/venv"
          export PATH="$work/venv/bin:$PATH"
          export ALMASI_PATH="$work/libraries"

          python -m pip install ./loader
          mkdir -p "$ALMASI_PATH/almasi.a"
          cp -a core/a.py core/lib core/root core/plugins core/assets core/requirements.txt "$ALMASI_PATH/almasi.a/"
          cd "$work"
          python -c 'from almasi import a; a.tester.run()'
