name: Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build release artifacts
        run: |
          python -m pip install build
          python -m build

      - name: Install built wheel
        run: |
          python -m pip install dist/almasi-*.whl
          python -m pip check

      - name: Test installed distribution
        run: cd "$RUNNER_TEMP" && python -c 'import almasi; almasi.tester.run()'

      - name: Measure Stream performance
        run: |
          git fetch --depth=1 origin b8f6ee2e8fa3a9295ce4fcb242a873186b5f019f
          git show b8f6ee2e8fa3a9295ce4fcb242a873186b5f019f:root/resources/stream.py > "$RUNNER_TEMP/stream_before.py"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/root/tests/_benchmark_stream.py" "$RUNNER_TEMP/stream_before.py"
